version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"

    commit-message:
      prefix: "chore"
      include: "scope"

    labels:
      - "dependencies"
      - "chore"

    groups:
      vitest:
        patterns:
          - "vitest*"
          - "@vitest/*"
      safe-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

    ignore:
      - dependency-name: "typescript"
        versions: [">= 7.0.0"]
