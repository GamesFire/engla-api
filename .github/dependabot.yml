version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Kyiv"

    commit-message:
      prefix: "chore"
      include: "scope"

    labels:
      - "dependencies"
      - "javascript" 

    groups:
      vitest-ecosystem:
        patterns:
          - "vitest*"
          - "@vitest/*"
      
      safe-minor-patch-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "vitest*"
          - "@vitest/*" 

    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
